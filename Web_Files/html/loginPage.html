<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <title>Scam media</title>
  <meta name="comp1800 template" content="My 1800 App" />

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


</head>

<body class="container-fluid">



  <div class="container py-5" style="max-width: 420px;">
    <!-- Alerts -->
    <div id="authAlert" class="alert alert-danger d-none" role="alert"></div>
  
    <!-- Login -->
    <div id="loginView">
      <h3 class="mb-3 text-center">Login</h3>
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <input type="email" id="loginEmail" class="form-control" placeholder="Email" required />
        </div>
        <div class="mb-3">
          <input type="password" id="loginPassword" class="form-control" placeholder="Password" required />
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>
      <small class="d-block mt-3 text-center">
        Don’t have an account?
        <a href="#" id="toSignup">Sign up</a>
      </small>
    </div>
  
    <!-- Signup -->
    <div id="signupView" class="d-none">
      <h3 class="mb-3 text-center">Sign Up</h3>
      <form id="signupForm" novalidate>
        <div class="mb-3">
          <input type="text" id="signupName" class="form-control" placeholder="First and Last Name" aria-label="Full name"
            required />
        </div>
        <div class="mb-3">
          <input type="email" id="signupEmail" class="form-control" placeholder="Email" required />
        </div>
        <div class="mb-3">
          <input type="password" id="signupPassword" class="form-control" placeholder="Password" required />
        </div>
        <button type="submit" class="btn btn-success w-100">Create Account</button>
      </form>
      <small class="d-block mt-3 text-center">
        Already have an account?
        <a href="#" id="toLogin">Login</a>
      </small>
    </div>
  </div>



  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"></script>

    <script type="module" src="../js/app.js"></script>
    <script type="module" src="../js/authentication.js"></script>
    <script type="module" src="../js/firebaseConfig.js"></script>
    <script type="module" src="../js/loginSignup.js"></script>
</body>


</html>
