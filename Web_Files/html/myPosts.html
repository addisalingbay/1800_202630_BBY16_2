<!doctype html>
<html lang="en" data-bs-theme="dark">

<head>
  <title>ScamMedia | My Posts</title>
  <link rel="icon" type="image/x-icon" href="../../images/mr_hacker.ico">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/homePage.css">
  <link rel="stylesheet" href="../css/for-you.css">
  <link rel="stylesheet" href="../css/filters.css">
</head>

<body class="container-fluid scam-theme">

  <nav class="navbar navbar-expand navbar-dark fixed-bottom py-0">
    <div class="container-fluid">

      <ul class="navbar-nav nav-fill w-100">
        <li class="nav-item mx-1">
          <a class="nav-link" href="homePage.html">
            <figure class="justify-content-center align-items-center d-flex flex-column mb-0">
              <img src="../../images/home.png" class="img-fluid imgButton" width="40px">
              <p>Home</p>
            </figure>
          </a>
        </li>
        <li class="nav-item mx-1">
          <a class="nav-link active" aria-current="page" href="myPosts.html">
            <figure class="justify-content-center align-items-center d-flex flex-column mb-0">
              <img src="../../images/myPosts.png" class="img-fluid imgButton" width="40px">
              <p>My Posts</p>
            </figure>
          </a>
        </li>
        <li class="nav-item mx-1">
          <a class="nav-link" href="../html/createPost.html">
            <figure class="justify-content-center align-items-center d-flex flex-column mb-0">
              <img src="../../images/plus.png" class="img-fluid imgButton" width="40px">
              <p>Post</p>
            </figure>
          </a>
        </li>
        <li class="nav-item mx-1">
          <a class="nav-link" href="../../for_you_page/bookmarked_page/bookmarked.html">
            <figure class="justify-content-center align-items-center d-flex flex-column mb-0">
              <img src="../../images/bookmark.png" class="img-fluid imgButton" width="40px">
              <p>Saved</p>
            </figure>
          </a>
        </li>
        <li class="nav-item mx-1">
          <a class="nav-link" href="#" id="settingsNavLink" role="button"
             aria-controls="settingsOffcanvas" aria-expanded="false">
            <figure class="justify-content-center align-items-center d-flex flex-column mb-0">
              <img src="../../images/settings.png" class="img-fluid imgButton" width="40px">
              <p>Settings</p>
            </figure>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <div id="topBar" class="d-flex align-items-center justify-content-center">
    <h1 id="mainHeading" class="text-center fw-bold my-3">My Posts</h1>
  </div>

  <!-- Settings overlay (Bootstrap Offcanvas, slides in from the right). Opened by the Settings icon in the navbar.
       Only the back arrow and Sign Out do anything; the three rows are display only. -->
  <div class="offcanvas offcanvas-end settings-panel" tabindex="-1" id="settingsOffcanvas" aria-labelledby="settingsUsername">
    <div class="settings-banner position-relative flex-shrink-0">
      <button type="button" id="settingsBack" class="btn btn-link settings-back" aria-label="Close settings">
        <i class="bi bi-arrow-left"></i>
      </button>
      <div class="settings-avatar" role="img" aria-label="Profile picture"></div>
    </div>

    <div class="settings-body flex-grow-1 px-4 pb-4">
      <div class="text-end settings-identity">
        <h2 id="settingsUsername" class="settings-username text-uppercase fw-bold mb-0"></h2>
        <p id="settingsJoined" class="settings-joined mb-0"></p>
      </div>

      <ul class="settings-list list-unstyled text-end mb-0">
        <li><span>Appearance</span><i class="bi bi-brightness-high" aria-hidden="true"></i></li>
        <li><span>About Us</span><i class="bi bi-info-circle-fill" aria-hidden="true"></i></li>
        <li><span>Contact Us</span><i class="bi bi-envelope" aria-hidden="true"></i></li>
      </ul>

      <div class="settings-actions">
        <button type="button" id="signOutButton" class="btn settings-signout w-100">Sign Out</button>
        <p id="signOutError" class="text-danger small text-center mt-2 mb-0 d-none" role="alert"></p>
      </div>
    </div>
  </div>

  <main class="container feed-width py-3" id="for-you-page" style="padding-bottom: 8rem;">
    <!-- The filter button is added here by myPosts.js -->
    <div id="greeting" class="clearfix mb-2"></div>

    <section id="post-feed" aria-label="My posts feed"></section>

    <div id="feed-sentinel" class="text-center py-4" aria-live="polite">
      <span class="visually-hidden">Loading posts...</span>
    </div>
  </main>

  <div id="post-details" class="post-details" role="dialog" aria-modal="true" aria-label="Post details"
    aria-hidden="true" inert>
    <div class="post-details-panel feed-width mx-auto d-flex flex-column h-100 bg-body">
      <header class="d-flex align-items-center justify-content-between px-3 py-2 flex-shrink-0">
        <button type="button" id="post-details-back" class="btn btn-link text-body p-0 fs-2 lh-1"
          aria-label="Back to feed">
          <i class="bi bi-arrow-left"></i>
        </button>

        <button type="button" id="post-details-bookmark" class="btn btn-link text-body p-0 fs-3 lh-1 post-action"
          data-bookmark-button aria-label="Save post" aria-pressed="false">
          <i class="bi bi-bookmark"></i>
        </button>
      </header>

      <div id="post-details-scroll" class="post-details-scroll flex-grow-1 px-3 pb-3">
        <div id="post-details-post"></div>

        <section class="mt-3" aria-labelledby="comments-heading">
          <h2 id="comments-heading" class="h6 text-body-secondary mb-2">
            Comments <span id="comments-count" class="badge text-bg-secondary rounded-pill">0</span>
          </h2>
          <div id="comments-list" class="d-flex flex-column gap-2"></div>
          <p id="comments-empty" class="text-body-secondary small text-center py-3 mb-0 d-none">
            no comments yet
          </p>
        </section>
      </div>

      <footer id="comment-launch-bar"
        class="comment-bar comment-launch-bar flex-shrink-0 bg-body-secondary border-top px-3 py-2">
        <div class="d-flex align-items-center gap-2">
          <div class="post-avatar post-avatar-sm user-avatar" role="img" aria-label="Your profile picture"></div>
          <input type="text" id="comment-launch" class="form-control form-control-sm rounded-pill"
            placeholder="Write a comment..." aria-label="Write a comment" aria-haspopup="dialog" autocomplete="off"
            readonly>

          <button type="button" class="btn btn-link text-body p-0 fs-5 lh-1 post-action" aria-label="Send comment">
            <i class="bi bi-send"></i>
          </button>
          <button type="button" class="btn btn-link text-body p-0 fs-5 lh-1 post-action" aria-label="Add emoji">
            <i class="bi bi-emoji-smile"></i>
          </button>
          <button type="button" class="btn btn-link text-body p-0 fs-5 lh-1 post-action" aria-label="Add image">
            <i class="bi bi-image"></i>
          </button>
        </div>
      </footer>
    </div>
  </div>

  <div id="comments-overlay" class="comments-overlay" role="dialog" aria-modal="true"
    aria-labelledby="comments-overlay-title" aria-hidden="true" inert>
    <div class="comments-panel feed-width mx-auto d-flex flex-column h-100 bg-body">
      <header class="overlay-header flex-shrink-0 px-3 py-2">
        <button type="button" id="comments-back" class="btn btn-link text-body p-0 fs-2 lh-1" aria-label="Back to post">
          <i class="bi bi-arrow-left"></i>
        </button>
        <h2 id="comments-overlay-title" class="h5 fw-bold text-center mb-0">Comments</h2>
        <span aria-hidden="true"></span>
      </header>

      <div id="comments-overlay-scroll" class="comments-overlay-scroll flex-grow-1 px-3 pb-3">
        <div id="comments-overlay-list" class="d-flex flex-column gap-2"></div>
        <p id="comments-overlay-empty" class="text-body-secondary small text-center py-5 mb-0 d-none">
          no comments yet
        </p>
      </div>

      <footer class="comment-bar flex-shrink-0 bg-body-secondary border-top px-3 py-2">
        <div class="d-flex align-items-end gap-2">
          <div class="post-avatar post-avatar-sm user-avatar mb-1" role="img" aria-label="Your profile picture"></div>
          <textarea id="comment-textarea" class="form-control form-control-sm comment-textarea" rows="1"
            placeholder="Write a comment..." aria-label="Write a comment" maxlength="1000"
            autocomplete="off"></textarea>

          <button type="button" id="comment-send" class="btn btn-link text-body p-0 fs-5 lh-1 mb-1"
            aria-label="Send comment" disabled>
            <i class="bi bi-send"></i>
          </button>
          <button type="button" class="btn btn-link text-body p-0 fs-5 lh-1 mb-1 post-action" aria-label="Add emoji">
            <i class="bi bi-emoji-smile"></i>
          </button>
          <button type="button" class="btn btn-link text-body p-0 fs-5 lh-1 mb-1 post-action" aria-label="Add image">
            <i class="bi bi-image"></i>
          </button>
        </div>
      </footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/myPosts.js"></script>
  <script type="module" src="../js/settings.js"></script>
</body>

</html>
