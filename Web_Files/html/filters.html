<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScamMedia | For You</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/for-you.css" rel="stylesheet">
</head>

<body class="scam-theme">

  <main class="container feed-width py-3" id="for-you-page">
    <h1 class="display-6 fw-bold mb-3 d-flex align-items-center justify-content-between gap-2" id="greeting">
      <span class="text-truncate">Hi <span id="greeting-username">there</span></span>
      <button type="button" id="filter-button" class="btn btn-link p-0 flex-shrink-0 position-relative lh-1"
        aria-label="Open filters" aria-haspopup="dialog">
        <img src="../../images/filter.png" width="45px" alt="">
      </button>
    </h1>

    <section id="post-feed" aria-label="For You feed"></section>

    <div id="feed-sentinel" class="text-center py-4" aria-live="polite">
      <span class="visually-hidden">Loading posts...</span>
    </div>
  </main>

  <div id="post-details" class="post-details" role="dialog" aria-modal="true" aria-label="Post details"
    aria-hidden="true" inert>
    <div class="post-details-panel feed-width mx-auto d-flex flex-column h-100 bg-body">
      <header class="d-flex align-items-center justify-content-between px-3 py-2 flex-shrink-0">
        <button type="button" id="post-details-back" class="btn btn-link text-body p-0 fs-2 lh-1"
          aria-label="Back to feed">
          <i class="bi bi-arrow-left"></i>
        </button>

        <button type="button" id="post-details-bookmark" class="btn btn-link text-body p-0 fs-3 lh-1 post-action"
          data-bookmark-button aria-label="Save post" aria-pressed="false">
          <i class="bi bi-bookmark"></i>
        </button>
      </header>

      <div id="post-details-scroll" class="post-details-scroll flex-grow-1 px-3 pb-3">
        <div id="post-details-post"></div>

        <section class="mt-3" aria-labelledby="comments-heading">
          <h2 id="comments-heading" class="h6 text-body-secondary mb-2">
            Comments <span id="comments-count" class="badge text-bg-secondary rounded-pill">0</span>
          </h2>
          <div id="comments-list" class="d-flex flex-column gap-2"></div>
          <p id="comments-empty" class="text-body-secondary small text-center py-3 mb-0 d-none">
            no comments yet
          </p>
        </section>
      </div>

      <footer id="comment-launch-bar"
        class="comment-bar comment-launch-bar flex-shrink-0 bg-body-secondary border-top px-3 py-2">
        <div class="d-flex align-items-center gap-2">
          <div class="post-avatar post-avatar-sm user-avatar" role="img" aria-label="Your profile picture"></div>
          <input type="text" id="comment-launch" class="form-control form-control-sm rounded-pill"
            placeholder="Write a comment..." aria-label="Write a comment" aria-haspopup="dialog" autocomplete="off"
            readonly>

          <button type="button" class="btn btn-link text-body p-0 fs-5 lh-1 post-action" aria-label="Send comment">
            <i class="bi bi-send"></i>
          </button>
          <button type="button" class="btn btn-link text-body p-0 fs-5 lh-1 post-action" aria-label="Add emoji">
            <i class="bi bi-emoji-smile"></i>
          </button>
          <button type="button" class="btn btn-link text-body p-0 fs-5 lh-1 post-action" aria-label="Add image">
            <i class="bi bi-image"></i>
          </button>
        </div>
      </footer>
    </div>
  </div>

  <div id="comments-overlay" class="comments-overlay" role="dialog" aria-modal="true"
    aria-labelledby="comments-overlay-title" aria-hidden="true" inert>
    <div class="comments-panel feed-width mx-auto d-flex flex-column h-100 bg-body">
      <header class="overlay-header flex-shrink-0 px-3 py-2">
        <button type="button" id="comments-back" class="btn btn-link text-body p-0 fs-2 lh-1" aria-label="Back to post">
          <i class="bi bi-arrow-left"></i>
        </button>
        <h2 id="comments-overlay-title" class="h5 fw-bold text-center mb-0">Comments</h2>
        <span aria-hidden="true"></span>
      </header>

      <div id="comments-overlay-scroll" class="comments-overlay-scroll flex-grow-1 px-3 pb-3">
        <div id="comments-overlay-list" class="d-flex flex-column gap-2"></div>
        <p id="comments-overlay-empty" class="text-body-secondary small text-center py-5 mb-0 d-none">
          no comments yet
        </p>
      </div>

      <footer class="comment-bar flex-shrink-0 bg-body-secondary border-top px-3 py-2">
        <div class="d-flex align-items-end gap-2">
          <div class="post-avatar post-avatar-sm user-avatar mb-1" role="img" aria-label="Your profile picture"></div>
          <textarea id="comment-textarea" class="form-control form-control-sm comment-textarea" rows="1"
            placeholder="Write a comment..." aria-label="Write a comment" maxlength="1000"
            autocomplete="off"></textarea>

          <button type="button" id="comment-send" class="btn btn-link text-body p-0 fs-5 lh-1 mb-1"
            aria-label="Send comment" disabled>
            <i class="bi bi-send"></i>
          </button>
          <button type="button" class="btn btn-link text-body p-0 fs-5 lh-1 mb-1 post-action" aria-label="Add emoji">
            <i class="bi bi-emoji-smile"></i>
          </button>
          <button type="button" class="btn btn-link text-body p-0 fs-5 lh-1 mb-1 post-action" aria-label="Add image">
            <i class="bi bi-image"></i>
          </button>
        </div>
      </footer>
    </div>
  </div>

  <div id="filter-modal" class="filter-modal" role="dialog" aria-modal="true" aria-labelledby="filter-title"
    aria-hidden="true" inert>
    <form id="filter-form" class="filter-panel card bg-body-tertiary border-0 rounded-3 overflow-hidden" novalidate>
      <header class="card-header bg-body-secondary border-0 d-flex align-items-center justify-content-between px-3 py-2">
        <span class="filter-header-spacer" aria-hidden="true"></span>
        <h2 id="filter-title" class="h4 fw-bold text-center mb-0">Filter</h2>
        <button type="button" id="filter-close" class="btn btn-link text-body p-0 fs-2 lh-1" aria-label="Close filters">
          <i class="bi bi-x-lg"></i>
        </button>
      </header>

      <div class="card-body d-flex flex-column gap-3">
        <div>
          <label for="filter-keywords" class="form-label fw-bold small mb-1">Keywords:</label>
          <input type="text" id="filter-keywords" maxlength="100" autocomplete="off"
            class="form-control bg-body-secondary border-0 rounded-3" placeholder="Search titles and descriptions...">
        </div>

        <div>
          <span class="form-label fw-bold small mb-1 d-block">Tags:</span>
          <div class="filter-tag-bar bg-body-secondary rounded-3 d-flex flex-wrap align-items-center gap-2 p-2">
            <button type="button" id="filter-add-tag" class="btn btn-link text-body p-0 fs-4 lh-1"
              aria-label="Choose tags" aria-expanded="false" aria-controls="filter-tag-picker">
              <i class="bi bi-plus-lg"></i>
            </button>
            <div id="filter-selected-tags" class="d-flex flex-wrap gap-1"></div>
          </div>
          <div id="filter-tag-picker" class="mt-2 p-2 bg-body-secondary rounded-3 d-none">
            <div id="filter-available-tags" class="d-flex flex-wrap gap-1"></div>
            <div id="filter-tag-status" class="form-text"></div>
          </div>
        </div>

        <div class="bg-body-secondary rounded-3 px-3 py-2 d-flex align-items-center gap-3" role="radiogroup"
          aria-labelledby="filter-likes-label">
          <span id="filter-likes-label" class="fw-bold small me-auto">Likes:</span>
          <div class="form-check form-check-reverse mb-0">
            <input class="form-check-input" type="radio" name="filter-likes" id="filter-likes-asc" value="asc">
            <label class="form-check-label small" for="filter-likes-asc">Ascending</label>
          </div>
          <div class="form-check form-check-reverse mb-0 me-0">
            <input class="form-check-input" type="radio" name="filter-likes" id="filter-likes-desc" value="desc">
            <label class="form-check-label small" for="filter-likes-desc">Descending</label>
          </div>
        </div>

        <div class="bg-body-secondary rounded-3 px-3 py-2 d-flex align-items-center gap-3" role="radiogroup"
          aria-labelledby="filter-date-label">
          <span id="filter-date-label" class="fw-bold small me-auto">Date:</span>
          <div class="form-check form-check-reverse mb-0">
            <input class="form-check-input" type="radio" name="filter-date" id="filter-date-latest" value="latest" checked>
            <label class="form-check-label small" for="filter-date-latest">Latest</label>
          </div>
          <div class="form-check form-check-reverse mb-0 me-0">
            <input class="form-check-input" type="radio" name="filter-date" id="filter-date-oldest" value="oldest">
            <label class="form-check-label small" for="filter-date-oldest">Oldest</label>
          </div>
        </div>

        <div class="d-flex gap-3">
          <button type="button" id="filter-clear" class="btn btn-outline-secondary fw-bold rounded-3 flex-fill">Clear All</button>
          <button type="submit" id="filter-apply" class="btn btn-primary fw-bold rounded-3 flex-fill">Apply</button>
        </div>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/for-you.js"></script>
</body>

</html>
