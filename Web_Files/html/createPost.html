  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

</head>

<body class="container-fluid scam-theme">



  <nav class="navbar navbar-expand navbar-dark fixed-bottom py-0">
    <div class="container-fluid">

      <ul class="navbar-nav nav-fill w-100">
        <li class="nav-item mx-1">
          <a class="nav-link" href="../html/homePage.html">
            <figure class="justify-content-center align-items-center d-flex flex-column mb-0">
              <img src="../../images/home.png" class="img-fluid imgButton" width="40px">
              <p>Home</p>
            </figure>
          </a>
        </li>
        <li class="nav-item mx-1">
          <a class="nav-link " href="#">
            <figure class="justify-content-center align-items-center d-flex flex-column mb-0">
              <img src="../../images/quiz.png" class="img-fluid imgButton" width="40px">
              <p>Quizzes</p>
            </figure>
          </a>
        </li>
        <li class="nav-item mx-1">
          <a class="nav-link" href="#">
            <figure class="justify-content-center align-items-center d-flex flex-column mb-0">
              <img src="../../images/plus.png" class="img-fluid imgButton" width="40px">
              <p>Post</p>
            </figure>
          </a>
        </li>
        <li class="nav-item mx-1">
          <a class="nav-link" href="#">
            <figure class="justify-content-center align-items-center d-flex flex-column mb-0">
              <img src="../../images/bookmark.png" class="img-fluid imgButton" width="40px">
              <p>Saved</p>
            </figure>
          </a>
        </li>
        <li class="nav-item mx-1">
          <a class="nav-link" href="#">
            <figure class="justify-content-center align-items-center d-flex flex-column mb-0">
              <img src="../../images/settings.png" class="img-fluid imgButton" width="40px">
              <p>Settings</p>
            </figure>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <div id="topBar" class="text-center">
    <h1 id="mainHeading" class="text-center fw-bold my-3">Create Post</h1>
  </div>
  
  <div class="container pb-3 create-wrap">
  
    <form id="createPost" class="card bg-body-tertiary border-0 rounded-3 overflow-hidden">
  
      <!-- Header: same layout as a feed post -->
      <div class="card-header bg-transparent border-0 d-flex align-items-center gap-2 py-2">
        <div class="post-avatar"></div>
        <span id="composerUsername" class="fw-bold flex-grow-1 text-truncate">You</span>
        <span class="small text-body-secondary">New post</span>
      </div>
  
      <!-- Title + selected tags, like the feed card -->
      <div class="px-3 pb-2">
        <input type="text" id="title" maxlength="160"
          class="form-control form-control-lg bg-transparent border-0 px-0 h5 fw-bold mb-1"
          placeholder="Title..." autocomplete="off">
        <div id="postTags"></div>
      </div>
  
      <div class="card-body pt-1">
        <textarea id="description"
          class="form-control bg-transparent border-0 px-0 post-body"
          placeholder="What's on your mind..."></textarea>
  
        <!-- Actions -->
        <div class="d-flex gap-2 mt-3">
          <button type="button" id="addTagsButton"
            class="btn btn-sm btn-outline-secondary rounded-pill px-3 d-inline-flex align-items-center gap-2">
            <i class="bi bi-tag"></i> Add tags
          </button>
          <button type="button" id="addImagesButton"
            class="btn btn-sm btn-outline-secondary rounded-pill px-3 d-inline-flex align-items-center gap-2">
            <i class="bi bi-image"></i> Image link
          </button>
        </div>
  
        <!-- Tag picker -->
        <div id="tagSection" class="mt-3 p-3 bg-body-secondary rounded-3 d-none">
          <p class="fw-bold small mb-2">Choose tags</p>
          <div id="availableTags"></div>
          <div id="tagStatus" class="form-text"></div>
        </div>
  
        <!-- Image link -->
        <div id="imageLinkSection" class="mt-3 p-3 bg-body-secondary rounded-3 d-none">
          <label for="imageUrl" class="form-label fw-bold small mb-1">Image link</label>
          <input type="url" id="imageUrl" maxlength="2048"
            class="form-control bg-body border-0 rounded-3"
            placeholder="https://example.com/photo.jpg" autocomplete="off">
          <div class="form-text">Paste a direct link to a picture. It must start with https://</div>
          <img id="imageLinkPreview" class="img-fluid rounded-3 mt-2 d-none" alt="Image preview">
        </div>
      </div>
    </form>
  
    <div id="postError" class="alert alert-danger mt-3 d-none" role="alert"></div>
  
    <div class="d-flex gap-3 mt-3">
      <button type="button" id="returnButton" class="btn btn-outline-secondary btn-lg fw-bold rounded-3 flex-fill">Return</button>
      <button type="submit" form="createPost" id="createPostButton" class="btn btn-primary btn-lg fw-bold rounded-3 flex-fill">Post</button>
    </div>
  
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/createPost.js"></script>



</body>
