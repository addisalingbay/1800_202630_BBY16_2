</head>

<body class="container-fluid">



  <nav class="navbar navbar-expand navbar-dark fixed-bottom py-0">
    <div class="container-fluid bg-dark">

      <ul class="navbar-nav nav-fill w-100">
        <li class="nav-item mx-1">
          <a class="nav-link" href="../html/homePage.html">
            <figure class="justify-content-center align-items-center d-flex flex-column mb-0">
              <img src="../../images/home.png" class="img-fluid imgButton" width="40px">
              <p>Home</p>
            </figure>
          </a>
        </li>
        <li class="nav-item mx-1">
          <a class="nav-link " href="#">
            <figure class="justify-content-center align-items-center d-flex flex-column mb-0">
              <img src="../../images/quiz.png" class="img-fluid imgButton" width="40px">
              <p>Quizzes</p>
            </figure>
          </a>
        </li>
        <li class="nav-item mx-1">
          <a class="nav-link" href="#">
            <figure class="justify-content-center align-items-center d-flex flex-column mb-0">
              <img src="../../images/plus.png" class="img-fluid imgButton" width="40px">
              <p>Post</p>
            </figure>
          </a>
        </li>
        <li class="nav-item mx-1">
          <a class="nav-link" href="#">
            <figure class="justify-content-center align-items-center d-flex flex-column mb-0">
              <img src="../../images/bookmark.png" class="img-fluid imgButton" width="40px">
              <p>Saved</p>
            </figure>
          </a>
        </li>
        <li class="nav-item mx-1">
          <a class="nav-link" href="#">
            <figure class="justify-content-center align-items-center d-flex flex-column mb-0">
              <img src="../../images/settings.png" class="img-fluid imgButton" width="40px">
              <p>Settings</p>
            </figure>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <div id="topBar" class="row align-items-center">

    <h1 id="mainHeading" class="text-center fw-bold col text-center text-nowrap my-4">Create Post</h1>

  </div>

  <div class="container py-3">

    <form id="createPost" class="bg-light rounded-4 p-4">
      <div class="rounded-4 mb-4 ">


        <div id="logoAvatar" class="mb-4">
          <img src="../../images/logo.jpg" width="50px">
          <input type="text" id="title" class="form-control border-0 rounded-3" placeholder="Title...">
        </div>


        <textarea id="description" class="form-control border-0 rounded-3 mb-2 post-body"
          placeholder="Whats on your mind..." style="height: 40vh"></textarea>


        <div id="preview" class="fw-bold small mb-5 d-flex gap-4">
          <div class="w-50">
            <p>Tags:</p>
            <div id="postTags"></div>
          </div>
          <div class="w-50">
            <p>Images:</p>
            <div id="postImage">
              <img src="../../images/image.png" width="25px">
            </div>
          </div>

        </div>

        <!-- Action  -->
        <div class="d-flex justify-content-between gap-4">
          <button type="button" id="AddTagsButton"
            class="btn btn-light fw-bold rounded-3 flex-fill d-flex justify-content-center align-items-center gap-2 w-50">
            <p class="mb-0">Add Tags</p><img src="../../images/tag.png" width="25">
          </button>
          <button type="button" id="addImagesButton"
            class="btn btn-light fw-bold rounded-4 flex-fill d-flex justify-content-center align-items-center gap-2 w-50">
            <p class="mb-0">Image Link</p><img src="../../images/image.png" width="25px">
          </button>
        </div>

        <!-- Paste-a-link image field (shown when "Image Link" is clicked) -->
        <div id="imageLinkSection" class="mt-3 d-none">
          <label for="imageUrl" class="form-label fw-bold small mb-1">Image link</label>
          <input type="url" id="imageUrl" class="form-control border-0 rounded-3" maxlength="2048"
            placeholder="https://example.com/photo.jpg" autocomplete="off">
          <div class="form-text">Paste a direct link to a picture. It must start with https://</div>
          <img id="imageLinkPreview" class="img-fluid rounded-3 mt-2 d-none" style="max-height: 200px;" alt="Image preview">
        </div>
      </div>
    </form>

    
    <div id="postError" class="alert alert-danger mt-3 d-none" role="alert"></div>

    <div class="d-flex justify-content-end mt-2 gap-5">
      <button type="button" id="returnButton" class="btn btn-secondary btn-lg fw-bold fs-2 px-4 post-btn w-50">Return</button>
      <button type="submit" form="createPost" id="createPostButton" class="btn btn-secondary btn-lg fw-bold fs-2 px-4 post-btn w-50">Post</button>
    </div>

  </div>

  <div id="preview" hidden></div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/createPost.js"></script>



</body>


</html>
