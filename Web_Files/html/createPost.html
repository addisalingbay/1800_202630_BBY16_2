<body class="container-fluid">



  <nav class="navbar navbar-expand navbar-dark fixed-bottom py-0" >
    <div class="container-fluid">

      <ul class="navbar-nav nav-fill w-100">
        <li class="nav-item mx-1">
          <a class="nav-link" href="#">
            <figure class="justify-content-center align-items-center d-flex flex-column mb-0">
              <img src="../../images/home.png" class="img-fluid imgButton" width="40px">

            </figure>
          </a>
        </li>
        <li class="nav-item mx-1">
          <a class="nav-link " href="#">
            <figure class="justify-content-center align-items-center d-flex flex-column mb-0">
              <img src="../../images/quiz.png" class="img-fluid imgButton" width="40px">
              <p>Quizzes</p>
            </figure>
          </a>
        </li>
        <li class="nav-item mx-1">
          <a class="nav-link" href="#">
            <figure class="justify-content-center align-items-center d-flex flex-column mb-0">
              <img src="../../images/plus.png" class="img-fluid imgButton" width="40px">
              <p>Post</p>
            </figure>
          </a>
        </li>
        <li class="nav-item mx-1">
          <a class="nav-link" href="#">
            <figure class="justify-content-center align-items-center d-flex flex-column mb-0">
              <img src="../../images/bookmark.png" class="img-fluid imgButton" width="40px">

            </figure>
          </a>
        </li>
        <li class="nav-item mx-1">
          <a class="nav-link" href="#">
            <figure class="justify-content-center align-items-center d-flex flex-column mb-0">
              <img src="../../images/settings.png" class="img-fluid imgButton" width="40px">
              <p>Settings</p>
            </figure>
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <div id="topBar" class="row align-items-center">

    <h1 id="mainHeading" class="text-center fw-bold col text-center text-nowrap">Create Post</h1>

  </div>

  <div class="container py-3">

    <form>
      <div class="rounded-4 p-3">

        <!-- Avatar + title -->
        <div id="logoAvatar" class="mb-4">
          <img src="../../images/logo.jpg" width="50px">
          <input type="text" class="form-control border-0 rounded-3" placeholder="Title...">
        </div>

        <!-- Body -->
        <textarea id="description"class="form-control border-0 rounded-3 mb-2 post-body" placeholder="Whats on your mind..."></textarea>

        <!-- Tags label -->
        <div class="fw-bold small mb-5"><p>Tags:</p></div>

        <!-- Action buttons -->
        <div class="d-flex justify-content-between gap-2">
          <button type="button" class="btn btn-light fw-bold rounded-3 flex-fill">Add tags</button>
          <button type="button" class="btn btn-light fw-bold rounded-3 flex-fill">Add Images</button>
        </div>
      </div>

    </form>

    <!-- Post button, outside the card, right-aligned -->
    <div class="d-flex justify-content-end mt-2">
      <button type="submit" class="btn btn-secondary btn-lg fw-bold fs-3 px-4 post-btn">Post</button>
    </div>

  </div>



  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
