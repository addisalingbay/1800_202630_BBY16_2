<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScamMedia | For You</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="for-you.css" rel="stylesheet">
</head>
<body>

  <main class="container feed-width py-3" id="for-you-page">
    <h1 class="display-6 fw-bold mb-3" id="greeting">Hi <span id="greeting-username">[USERNAME_456]</span></h1>

    <section id="post-feed" aria-label="For You feed"></section>

    <p id="feed-empty" class="text-body-secondary text-center py-5 mb-0 d-none">No posts yet.</p>

    <div id="feed-sentinel" class="text-center py-4">
      <div class="spinner-border text-secondary" role="status">
        <span class="visually-hidden">Loading more posts...</span>
      </div>
    </div>
  </main>

  <div id="post-details" class="post-details" role="dialog" aria-modal="true"
       aria-label="Post details" aria-hidden="true" inert>
    <div class="post-details-panel feed-width mx-auto d-flex flex-column h-100 bg-body">
      <header class="d-flex align-items-center justify-content-between px-3 py-2 flex-shrink-0">
        <button type="button" id="post-details-back" class="btn btn-link text-body p-0 fs-2 lh-1" aria-label="Back to feed">
          <i class="bi bi-arrow-left"></i>
        </button>

        <button type="button" class="btn btn-link text-body p-0 fs-3 lh-1 post-action" aria-label="Bookmark post">
          <i class="bi bi-bookmark"></i>
        </button>
      </header>

      <div id="post-details-scroll" class="post-details-scroll flex-grow-1 px-3 pb-3">
        <div id="post-details-post"></div>

        <section class="mt-3" aria-labelledby="comments-heading">
          <h2 id="comments-heading" class="h6 text-body-secondary mb-2">
            Comments <span id="comments-count" class="badge text-bg-secondary rounded-pill">0</span>
          </h2>
          <div id="comments-list" class="d-flex flex-column gap-2"></div>
          <p id="comments-empty" class="text-body-secondary small text-center py-3 mb-0 d-none">
            No comments yet.
          </p>
        </section>
      </div>

      <footer class="comment-bar flex-shrink-0 bg-body-secondary border-top px-3 py-2">
        <div class="d-flex align-items-center gap-2">
          <div class="post-avatar post-avatar-sm"></div>
          <input type="text" id="comment-input" class="form-control form-control-sm rounded-pill"
                 placeholder="Write a comment..." aria-label="Write a comment" autocomplete="off">

          <button type="button" class="btn btn-link text-body p-0 fs-5 lh-1 post-action" aria-label="Send comment">
            <i class="bi bi-send"></i>
          </button>
          <button type="button" class="btn btn-link text-body p-0 fs-5 lh-1 post-action" aria-label="Add emoji">
            <i class="bi bi-emoji-smile"></i>
          </button>
          <button type="button" class="btn btn-link text-body p-0 fs-5 lh-1 post-action" aria-label="Add image">
            <i class="bi bi-image"></i>
          </button>
        </div>
      </footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js",
      "firebase/storage": "https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js"
    }
  }
  </script>
  <script type="module" src="for-you.js"></script>
</body>
</html>
