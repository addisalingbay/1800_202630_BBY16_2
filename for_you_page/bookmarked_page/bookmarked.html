<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ScamMedia | Saved</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="bookmarked.css" rel="stylesheet">
</head>
<body>

  <main class="container feed-width py-3 page-bottom-space" id="bookmarked-page">
    <h1 class="display-6 fw-bold pb-2 mb-3 border-bottom">SAVED</h1>

    <section id="folder-grid" class="row row-cols-2 g-2" aria-label="Saved folders"></section>

    <p id="folders-empty" class="text-body-secondary text-center py-5 mb-0 d-none">No saved folders yet.</p>
  </main>

  <div id="folder-overlay" class="folder-overlay" role="dialog" aria-modal="true"
       aria-labelledby="folder-title" aria-hidden="true" inert>
    <div class="folder-panel feed-width mx-auto d-flex flex-column h-100 bg-body">
      <header class="px-3 pt-3 flex-shrink-0">
        <button type="button" id="folder-back" class="btn btn-link text-body p-0 fs-2 lh-1" aria-label="Back to saved folders">
          <i class="bi bi-arrow-left"></i>
        </button>
        <h2 id="folder-title" class="display-6 fw-bold pb-2 mt-2 mb-0 border-bottom">FOLDER</h2>
      </header>

      <div id="folder-scroll" class="folder-scroll flex-grow-1 px-3 py-3">
        <div id="folder-posts" class="row row-cols-3 g-2"></div>
        <p id="folder-empty" class="text-body-secondary text-center py-5 mb-0 d-none">No saved posts in this folder yet.</p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="bookmarked.js"></script>
</body>
</html>
